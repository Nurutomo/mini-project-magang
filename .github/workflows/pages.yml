name: Build Firmware and Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [gateway-esp32c3, gateway-esp32classic, sensor-relay-esp32c3, sensor-relay-esp32classic]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: platformio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'partitions.csv', 'src/**', 'include/**', 'lib/**') }}
          restore-keys: |
            platformio-${{ runner.os }}-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist-firmware/${{ matrix.env }}"
          cp ".pio/build/${{ matrix.env }}/bootloader.bin" "dist-firmware/${{ matrix.env }}/"
          cp ".pio/build/${{ matrix.env }}/partitions.bin" "dist-firmware/${{ matrix.env }}/"
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "dist-firmware/${{ matrix.env }}/"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: dist-firmware/${{ matrix.env }}
          retention-days: 7

  prepare-pages:
    runs-on: ubuntu-latest
    needs: [build-firmware]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ESP32-C3 gateway firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-gateway-esp32c3
          path: dist/firmware/gateway-esp32c3

      - name: Download classic ESP32 gateway firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-gateway-esp32classic
          path: dist/firmware/gateway-esp32classic

      - name: Download ESP32-C3 sensor and relay firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-sensor-relay-esp32c3
          path: dist/firmware/sensor-relay-esp32c3

      - name: Download classic ESP32 sensor and relay firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-sensor-relay-esp32classic
          path: dist/firmware/sensor-relay-esp32classic

      - name: Prepare dashboard and manifests
        shell: bash
        run: |
          set -euo pipefail
          cp web/index.html dist/index.html
          printf '{"commit":"%s","builtAt":"%s"}\n' "${GITHUB_SHA::7}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/commit.json
          for env in gateway-esp32c3 gateway-esp32classic sensor-relay-esp32c3 sensor-relay-esp32classic; do
            if [[ "$env" == *esp32c3 ]]; then
              chip_family="ESP32-C3"
              bootloader_offset=0
            else
              chip_family="ESP32"
              bootloader_offset=4096
            fi
            if [[ "$env" == gateway-* ]]; then role="Gateway with OLED"; else role="Sensor and Relay"; fi
            cat > "dist/firmware/$env/manifest.json" <<EOF
          {
            "name": "$role ($chip_family)",
            "version": "0.2.1",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "$chip_family",
              "parts": [
                { "path": "bootloader.bin", "offset": $bootloader_offset },
                { "path": "partitions.bin", "offset": 32768 },
                { "path": "firmware.bin", "offset": 65536 }
              ]
            }]
          }
          EOF
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [prepare-pages]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

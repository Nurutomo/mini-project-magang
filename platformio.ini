[platformio]
default_envs = gateway-esp32c3

[env]
platform = espressif32@8.0.0
framework = arduino
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient@^2.8

[env:gateway-esp32c3]
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DEVICE_ROLE_SENSOR=0
  -D DEVICE_ROLE_RELAY=0
  -D DEVICE_ROLE_GATEWAY=1
  -D I2C_SDA_PIN=8
  -D I2C_SCL_PIN=9
  -D STATUS_LED_PIN=7

[env:gateway-esp32classic]
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE_SENSOR=0
  -D DEVICE_ROLE_RELAY=0
  -D DEVICE_ROLE_GATEWAY=1
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
  -D STATUS_LED_PIN=2

[env:sensor-relay-esp32c3]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DEVICE_ROLE_SENSOR=1
  -D DEVICE_ROLE_RELAY=1
  -D DEVICE_ROLE_GATEWAY=0
  -D I2C_SDA_PIN=8
  -D I2C_SCL_PIN=9
  -D STATUS_LED_PIN=7

[env:sensor-relay-esp32classic]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE_SENSOR=1
  -D DEVICE_ROLE_RELAY=1
  -D DEVICE_ROLE_GATEWAY=0
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
  -D NTC_ADC_PIN=32
  -D WIND_ADC_PIN=33
  -D BATTERY_ADC_PIN=34
  -D STATUS_LED_PIN=2

[platformio]
default_envs = sensor-node

[env]
platform = espressif32@8.0.0
framework = arduino
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient@^2.8

[env:sensor-node]
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE_SENSOR=1
  -D DEVICE_ROLE_RELAY=1

[env:relay-node]
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE_SENSOR=0
  -D DEVICE_ROLE_RELAY=1

[env:gateway]
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE_SENSOR=0
  -D DEVICE_ROLE_RELAY=0
  -D DEVICE_ROLE_GATEWAY=1
